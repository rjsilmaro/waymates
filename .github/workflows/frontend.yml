name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-lint:
    name: Build and Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/waymates-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/waymates-web
        run: npm ci

      - name: Lint
        working-directory: frontend/waymates-web
        run: npm run lint

      - name: Build
        working-directory: frontend/waymates-web
        run: npm run build